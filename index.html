<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расписание ИНС-б-о-26-2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      
      /* Зеленый фон для лекций */
      --lecture-bg: rgba(16, 185, 129, 0.12);
      --lecture-border: rgba(16, 185, 129, 0.35);
      --lecture-badge: #10b981;
      
      /* Оранжевый фон для практик и лаб */
      --practice-bg: rgba(245, 158, 11, 0.12);
      --practice-border: rgba(245, 158, 11, 0.35);
      --practice-badge: #f59e0b;

      /* Дефолтный фон */
      --default-bg: rgba(255, 255, 255, 0.04);
      --default-border: var(--border);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container { width: 100%; max-width: 860px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 { font-size: 1.6rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
    .updated-text { font-size: 0.8rem; color: var(--text-muted); }

    /* Панель выбора недель */
    .week-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      gap: 10px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .nav-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .week-select {
      background: #0b0f19;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      max-width: 280px;
      width: 100%;
      text-align: center;
    }

    /* Карточка дня */
    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .day-title { font-size: 1.2rem; font-weight: 700; color: #fff; }
    .day-date { font-size: 0.9rem; color: var(--text-muted); }

    /* Перерыв между парами */
    .break-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
      position: relative;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 500;
    }
    .break-indicator::before, .break-indicator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: dashed rgba(255, 255, 255, 0.1);
      margin: 0 10px;
    }

    /* Карточка пары */
    .lesson-item {
      display: grid;
      grid-template-columns: 85px 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 6px;
      border: 1px solid transparent;
      transition: transform 0.1s;
    }

    /* Цвета типов пар */
    .type-lecture {
      background: var(--lecture-bg);
      border-color: var(--lecture-border);
    }
    .type-practice, .type-lab {
      background: var(--practice-bg);
      border-color: var(--practice-border);
    }
    .type-other {
      background: var(--default-bg);
      border-color: var(--default-border);
    }

    .pair-time-block {
      display: flex;
      flex-direction: column;
    }
    .pair-num {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
    }
    .pair-hours {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .lesson-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lesson-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }

    .lesson-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-lec { background: var(--lecture-badge); color: #000; }
    .badge-prac { background: var(--practice-badge); color: #000; }
    .badge-def { background: rgba(255,255,255,0.2); color: #fff; }

    .room-tag {
      font-weight: 600;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .teacher-block {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: right;
      font-weight: 500;
      max-width: 180px;
    }

    .empty-day {
      color: var(--text-muted);
      font-style: italic;
      font-size: 0.9rem;
      padding: 10px 0;
    }

    @media (max-width: 600px) {
      .lesson-item {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .teacher-block { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>ИНС-б-о-26-2</h1>
        <div id="updatedAt" class="updated-text">Загрузка данных...</div>
      </div>
    </header>

    <!-- Навигация по неделям -->
    <div class="week-nav-bar">
      <button id="prevBtn" class="nav-btn" onclick="stepWeek(-1)">← Назад</button>
      <select id="weekSelect" class="week-select" onchange="onWeekSelectChange()"></select>
      <button id="nextBtn" class="nav-btn" onclick="stepWeek(1)">Вперед →</button>
    </div>

    <div id="scheduleContainer"></div>
  </div>

  <script>
    // Расписание звонков пар СКФУ
    const PAIR_TIMES = {
      1: { start: "08:30", end: "10:00", sMin: 510, eMin: 600 },
      2: { start: "10:10", end: "11:40", sMin: 610, eMin: 700 },
      3: { start: "12:00", end: "13:30", sMin: 720, eMin: 810 },
      4: { start: "13:50", end: "15:20", sMin: 830, eMin: 920 },
      5: { start: "15:30", end: "17:00", sMin: 930, eMin: 1020 },
      6: { start: "17:10", end: "18:40", sMin: 1030, eMin: 1120 },
      7: { start: "18:50", end: "20:20", sMin: 1130, eMin: 1220 }
    };

    let scheduleData = null;
    let weekKeys = [];
    let currentWeekIndex = 0;

    // Парсим корпус и аудиторию из строки вида "1-401", "22-309" или "1"
    function formatLocation(roomStr) {
      if (!roomStr) return '';
      roomStr = String(roomStr).trim();
      if (roomStr.includes('-')) {
        const parts = roomStr.split('-');
        return `Корп. ${parts[0]}, Ауд. ${parts[1]}`;
      }
      return `Ауд. ${roomStr}`;
    }

    // Форматирование времени перерыва
    function formatBreak(minutes) {
      if (minutes <= 0) return null;
      if (minutes >= 60) {
        const h = Math.floor(minutes / 60);
        const m = minutes % 60;
        return `Перерыв ${h} ч ${m > 0 ? m + ' мин' : ''}`;
      }
      return `Перерыв ${minutes} мин`;
    }

    async function loadSchedule() {
      try {
        const res = await fetch('schedule.json?t=' + new Date().getTime());
        scheduleData = await res.json();
        
        document.getElementById('updatedAt').innerText = 'Обновлено: ' + (scheduleData.updated_at || '');

        // Получаем ключи недель
        if (scheduleData.weeks) {
          weekKeys = Object.keys(scheduleData.weeks).sort();
        }

        if (weekKeys.length === 0) {
          document.getElementById('scheduleContainer').innerHTML = '<div class="empty-day">Расписание пусто</div>';
          return;
        }

        // Заполняем выпадающий список недель
        const select = document.getElementById('weekSelect');
        select.innerHTML = '';
        weekKeys.forEach((key, idx) => {
          const wObj = scheduleData.weeks[key];
          const mDate = new Date(key);
          const dateTitle = mDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = `Неделя ${wObj.week_number} (с ${dateTitle})`;
          select.appendChild(opt);
        });

        // Открываем первую неделю
        currentWeekIndex = 0;
        renderCurrentWeek();
      } catch (err) {
        document.getElementById('scheduleContainer').innerHTML = 
          '<div style="color: #ef4444; padding: 20px; text-align: center;">Файл schedule.json не найден. Запустите GitHub Action "Update Schedule".</div>';
      }
    }

    function onWeekSelectChange() {
      const select = document.getElementById('weekSelect');
      currentWeekIndex = parseInt(select.value, 10);
      renderCurrentWeek();
    }

    function stepWeek(delta) {
      const next = currentWeekIndex + delta;
      if (next >= 0 && next < weekKeys.length) {
        currentWeekIndex = next;
        document.getElementById('weekSelect').value = currentWeekIndex;
        renderCurrentWeek();
      }
    }

    function renderCurrentWeek() {
      document.getElementById('prevBtn').disabled = (currentWeekIndex === 0);
      document.getElementById('nextBtn').disabled = (currentWeekIndex === weekKeys.length - 1);

      const weekKey = weekKeys[currentWeekIndex];
      const weekObj = scheduleData.weeks[weekKey];
      const days = weekObj.days || [];
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';

      if (!days.length) {
        container.innerHTML = '<div class="day-card empty-day">Пар на этой неделе нет</div>';
        return;
      }

      days.forEach(day => {
        const card = document.createElement('div');
        card.className = 'day-card';

        const dDate = day.Date ? new Date(day.Date) : null;
        const dateStr = dDate ? dDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) : '';
        
        card.innerHTML = `
          <div class="day-header">
            <span class="day-title">${day.WeekDay || ''}</span>
            <span class="day-date">${dateStr}</span>
          </div>
        `;

        const lessons = day.Lessons || [];
        if (!lessons.length) {
          card.innerHTML += '<div class="empty-day">Пар нет</div>';
        } else {
          // Сортируем пары по номеру
          lessons.sort((a, b) => (a.LessonNumber || a.Id || 0) - (b.LessonNumber || b.Id || 0));

          for (let i = 0; i < lessons.length; i++) {
            const l = lessons[i];
            const pairNum = l.LessonNumber || l.Id || 1;
            const timeInfo = PAIR_TIMES[pairNum] || { start: '—', end: '—', sMin: 0, eMin: 0 };
            
            // Если между этой парой и предыдущей есть перерыв / окно
            if (i > 0) {
              const prevPairNum = lessons[i - 1].LessonNumber || lessons[i - 1].Id || 1;
              const prevTime = PAIR_TIMES[prevPairNum];
              if (prevTime && timeInfo.sMin) {
                const diffMin = timeInfo.sMin - prevTime.eMin;
                if (diffMin > 0) {
                  const breakDiv = document.createElement('div');
                  breakDiv.className = 'break-indicator';
                  breakDiv.textContent = formatBreak(diffMin);
                  card.appendChild(breakDiv);
                }
              }
            }

            const item = document.createElement('div');
            const typeStr = (l.Type || l.LessonType || '').toLowerCase();
            const rawType = l.Type || l.LessonType || '';

            // Определяем фон
            let typeClass = 'type-other';
            let badgeClass = 'badge-def';
            if (typeStr.includes('лекц')) {
              typeClass = 'type-lecture';
              badgeClass = 'badge-lec';
            } else if (typeStr.includes('практ') || typeStr.includes('лаб') || typeStr.includes('семин')) {
              typeClass = 'type-practice';
              badgeClass = 'badge-prac';
            }

            item.className = `lesson-item ${typeClass}`;

            const roomFormatted = formatLocation(l.Room || l.Auditory || '');
            const teacher = l.Teacher || l.TeacherName || '';

            item.innerHTML = `
              <div class="pair-time-block">
                <span class="pair-num">${pairNum} пара</span>
                <span class="pair-hours">${timeInfo.start} - ${timeInfo.end}</span>
              </div>
              <div class="lesson-main">
                <div class="lesson-title">${l.Discipline || 'Предмет'}</div>
                <div class="lesson-meta">
                  ${rawType ? `<span class="badge ${badgeClass}">${rawType}</span>` : ''}
                  ${roomFormatted ? `<span class="room-tag">📍 ${roomFormatted}</span>` : ''}
                </div>
              </div>
              <div class="teacher-block">
                ${teacher ? `👤 ${teacher}` : ''}
              </div>
            `;
            card.appendChild(item);
          }
        }

        container.appendChild(card);
      });
    }

    loadSchedule();
  </script>
</body>
</html>
