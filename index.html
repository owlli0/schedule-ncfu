<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расписание ИНС-б-о-26-2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      
      /* Зеленый фон для лекций */
      --lecture-bg: rgba(16, 185, 129, 0.14);
      --lecture-border: rgba(16, 185, 129, 0.4);
      --lecture-badge: #10b981;
      
      /* Оранжевый фон для практик и лаб */
      --practice-bg: rgba(245, 158, 11, 0.14);
      --practice-border: rgba(245, 158, 11, 0.4);
      --practice-badge: #f59e0b;

      --default-bg: rgba(255, 255, 255, 0.04);
      --default-border: var(--border);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 20px 14px;
      display: flex;
      justify-content: center;
    }

    .container { width: 100%; max-width: 860px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .updated-text { font-size: 0.8rem; color: var(--text-muted); }

    /* Панель переключения недель */
    .week-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      gap: 8px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .nav-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .week-select {
      background: #0b0f19;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      max-width: 320px;
      width: 100%;
      text-align: center;
    }

    /* Карточка дня */
    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .day-title { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .day-date { font-size: 0.88rem; color: var(--text-muted); }

    /* Блок перерыва */
    .break-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 500;
    }
    .break-indicator::before, .break-indicator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 10px;
    }

    /* Строка пары */
    .lesson-item {
      display: grid;
      grid-template-columns: 85px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 6px;
      border: 1px solid transparent;
    }

    .type-lecture {
      background: var(--lecture-bg);
      border-color: var(--lecture-border);
    }
    .type-practice, .type-lab {
      background: var(--practice-bg);
      border-color: var(--practice-border);
    }
    .type-other {
      background: var(--default-bg);
      border-color: var(--default-border);
    }

    .pair-time-block {
      display: flex;
      flex-direction: column;
    }
    .pair-num {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
    }
    .pair-hours {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .lesson-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lesson-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }

    .lesson-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-lec { background: var(--lecture-badge); color: #000; }
    .badge-prac { background: var(--practice-badge); color: #000; }
    .badge-def { background: rgba(255,255,255,0.2); color: #fff; }

    .room-tag {
      font-weight: 600;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .teacher-block {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: right;
      font-weight: 500;
      max-width: 220px;
    }

    .empty-day {
      color: var(--text-muted);
      font-style: italic;
      font-size: 0.9rem;
      padding: 10px 0;
    }

    @media (max-width: 650px) {
      .lesson-item {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .teacher-block { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>ИНС-б-о-26-2</h1>
        <div id="updatedAt" class="updated-text">Загрузка данных...</div>
      </div>
    </header>

    <div class="week-nav-bar">
      <button id="prevBtn" class="nav-btn" onclick="stepWeek(-1)">← Назад</button>
      <select id="weekSelect" class="week-select" onchange="onWeekSelectChange()"></select>
      <button id="nextBtn" class="nav-btn" onclick="stepWeek(1)">Вперед →</button>
    </div>

    <div id="scheduleContainer"></div>
  </div>

  <script>
    // Точное расписание звонков по твоей таблице
    const PAIR_TIMES = {
      1: { start: "08:00", end: "09:30", sMin: 480, eMin: 570 },
      2: { start: "09:40", end: "11:10", sMin: 580, eMin: 670 },
      3: { start: "11:20", end: "12:50", sMin: 680, eMin: 770 },
      4: { start: "13:20", end: "14:50", sMin: 800, eMin: 890 },
      5: { start: "15:00", end: "16:30", sMin: 900, eMin: 990 },
      6: { start: "16:50", end: "18:20", sMin: 1010, eMin: 1100 },
      7: { start: "18:30", end: "20:00", sMin: 1110, eMin: 1200 },
      8: { start: "20:10", end: "21:40", sMin: 1210, eMin: 1300 }
    };

    let scheduleData = null;
    let weekKeys = [];
    let currentWeekIndex = 0;

    // Извлечение безопасного текста из строки или объекта
    function extractText(val) {
      if (!val) return '';
      if (typeof val === 'string') return val.trim();
      if (typeof val === 'object') {
        return val.Name || val.FIO || val.ShortName || val.Value || val.Title || '';
      }
      return String(val).trim();
    }

    // Разбор корпуса и аудитории (до дефиса - корпус, после - аудитория)
    function formatLocation(rawVal) {
      const text = extractText(rawVal);
      if (!text) return '';
      if (text.includes('-')) {
        const parts = text.split('-');
        return `Корпус ${parts[0]}, Ауд. ${parts[1]}`;
      }
      return `Ауд. ${text}`;
    }

    // Форматирование времени перерыва
    function formatBreak(minutes) {
      if (minutes <= 0) return null;
      if (minutes >= 60) {
        const h = Math.floor(minutes / 60);
        const m = minutes % 60;
        return `Перерыв ${h} ч ${m > 0 ? m + ' мин' : ''}`;
      }
      return `Перерыв ${minutes} мин`;
    }

    // Получение номера пары
    function getPairNumber(lesson, index) {
      if (lesson.PairNumber) return Number(lesson.PairNumber);
      if (lesson.Number) return Number(lesson.Number);
      if (lesson.LessonNumber) return Number(lesson.LessonNumber);
      if (lesson.Pair) return Number(lesson.Pair);
      if (lesson.Id && lesson.Id >= 1 && lesson.Id <= 8) return Number(lesson.Id);
      return index + 1;
    }

    async function loadSchedule() {
      try {
        const res = await fetch('schedule.json?t=' + new Date().getTime());
        scheduleData = await res.json();
        
        document.getElementById('updatedAt').innerText = 'Обновлено: ' + (scheduleData.updated_at || '');

        if (scheduleData.weeks) {
          weekKeys = Object.keys(scheduleData.weeks).sort();
        }

        if (weekKeys.length === 0) {
          document.getElementById('scheduleContainer').innerHTML = '<div class="empty-day">Расписание пусто</div>';
          return;
        }

        const select = document.getElementById('weekSelect');
        select.innerHTML = '';
        weekKeys.forEach((key, idx) => {
          const wObj = scheduleData.weeks[key];
          const parts = key.split('-');
          const mDate = new Date(parts[0], parts[1] - 1, parts[2]);
          const dateTitle = mDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = `Неделя ${wObj.week_number} (с ${dateTitle})`;
          select.appendChild(opt);
        });

        currentWeekIndex = 0;
        renderCurrentWeek();
      } catch (err) {
        document.getElementById('scheduleContainer').innerHTML = 
          '<div style="color: #ef4444; padding: 20px; text-align: center;">Не удалось загрузить schedule.json</div>';
      }
    }

    function onWeekSelectChange() {
      const select = document.getElementById('weekSelect');
      currentWeekIndex = parseInt(select.value, 10);
      renderCurrentWeek();
    }

    function stepWeek(delta) {
      const next = currentWeekIndex + delta;
      if (next >= 0 && next < weekKeys.length) {
        currentWeekIndex = next;
        document.getElementById('weekSelect').value = currentWeekIndex;
        renderCurrentWeek();
      }
    }

    function renderCurrentWeek() {
      document.getElementById('prevBtn').disabled = (currentWeekIndex === 0);
      document.getElementById('nextBtn').disabled = (currentWeekIndex === weekKeys.length - 1);

      const weekKey = weekKeys[currentWeekIndex];
      const weekObj = scheduleData.weeks[weekKey];
      const days = weekObj.days || [];
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';

      if (!days.length) {
        container.innerHTML = '<div class="day-card empty-day">Пар на этой неделе нет</div>';
        return;
      }

      days.forEach(day => {
        const card = document.createElement('div');
        card.className = 'day-card';

        let dateStr = '';
        if (day.Date) {
          const datePart = day.Date.split('T')[0];
          const [y, m, d] = datePart.split('-');
          const localDate = new Date(y, m - 1, d);
          dateStr = localDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
        }

        card.innerHTML = `
          <div class="day-header">
            <span class="day-title">${day.WeekDay || ''}</span>
            <span class="day-date">${dateStr}</span>
          </div>
        `;

        const lessons = day.Lessons || [];
        if (!lessons.length) {
          card.innerHTML += '<div class="empty-day">Пар нет</div>';
        } else {
          // Сортировка по номеру пары
          lessons.sort((a, b) => getPairNumber(a, 0) - getPairNumber(b, 0));

          for (let i = 0; i < lessons.length; i++) {
            const l = lessons[i];
            const pairNum = getPairNumber(l, i);
            const timeInfo = PAIR_TIMES[pairNum] || { start: '08:00', end: '09:30', sMin: 0, eMin: 0 };
            
            // Расчет перерыва между парами
            if (i > 0) {
              const prevPairNum = getPairNumber(lessons[i - 1], i - 1);
              const prevTime = PAIR_TIMES[prevPairNum];
              if (prevTime && timeInfo.sMin) {
                const diffMin = timeInfo.sMin - prevTime.eMin;
                if (diffMin > 0) {
                  const breakDiv = document.createElement('div');
                  breakDiv.className = 'break-indicator';
                  breakDiv.textContent = formatBreak(diffMin);
                  card.appendChild(breakDiv);
                }
              }
            }

            const item = document.createElement('div');
            
            const rawType = extractText(l.Type || l.LessonType || l.TypeName || '');
            const typeLower = rawType.toLowerCase();

            // Зеленый для лекций, оранжевый для практик/лаб
            let typeClass = 'type-other';
            let badgeClass = 'badge-def';
            if (typeLower.includes('лекц')) {
              typeClass = 'type-lecture';
              badgeClass = 'badge-lec';
            } else if (typeLower.includes('практ') || typeLower.includes('лаб') || typeLower.includes('семин')) {
              typeClass = 'type-practice';
              badgeClass = 'badge-prac';
            }

            item.className = `lesson-item ${typeClass}`;

            const roomRaw = l.Auditory || l.Room || l.AuditoryName || l.RoomName || l.Auditorium || '';
            const roomFormatted = formatLocation(roomRaw);
            const teacher = extractText(l.Teacher || l.TeacherName || l.TeacherFIO || l.Lecturer || '');
            const discipline = extractText(l.Discipline || l.DisciplineName || l.Subject || 'Предмет');

            item.innerHTML = `
              <div class="pair-time-block">
                <span class="pair-num">${pairNum} пара</span>
                <span class="pair-hours">${timeInfo.start} - ${timeInfo.end}</span>
              </div>
              <div class="lesson-main">
                <div class="lesson-title">${discipline}</div>
                <div class="lesson-meta">
                  ${rawType ? `<span class="badge ${badgeClass}">${rawType}</span>` : ''}
                  ${roomFormatted ? `<span class="room-tag">📍 ${roomFormatted}</span>` : ''}
                </div>
              </div>
              <div class="teacher-block">
                ${teacher ? `👤 ${teacher}` : ''}
              </div>
            `;
            card.appendChild(item);
          }
        }

        container.appendChild(card);
      });
    }

    loadSchedule();
  </script>
</body>
</html>
